name: KRAMA OS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/krama?schema=public"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint Frontend
      run: pnpm --filter client run lint

    - name: Generate Prisma Client
      run: pnpm --filter server exec prisma generate
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/krama?schema=public"

    - name: Build Shared Packages
      run: pnpm --filter "./packages/*" run build

    - name: TypeScript Check (Backend)
      run: pnpm --filter server exec tsc --noEmit

    - name: Run Backend Tests
      run: pnpm --filter server run test || echo "Tests not configured yet"

    - name: TypeScript Check (Frontend)
      run: pnpm --filter client exec tsc -b

    - name: Docker Compose Smoke Test
      run: docker compose -f docker-compose.prod.yml build --progress=plain
