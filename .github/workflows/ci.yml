name: KRAMA OS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krama
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/krama?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-jwt-secret-32-chars-long!!"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/krama_integration_test?schema=public"
      TEST_REDIS_URL: "redis://localhost:6379/15"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint Workspace
      run: pnpm -r run lint

    - name: Generate Prisma Client
      run: pnpm --filter server exec prisma generate

    - name: Push Database Schema
      run: pnpm --filter server exec prisma db push

    - name: Build Monorepo Packages
      run: pnpm -r build

    - name: Run Validation Unit Tests
      run: pnpm --filter @krama/validation test

    - name: Run Backend Integration & Unit Tests
      run: |
        pnpm --filter server test
        pnpm --filter server test:integration
        pnpm --filter server test:startup
