server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    # 10 MB image plus multipart headers and boundary overhead.
    client_max_body_size 11m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static files must never fall through to the SPA document. In particular,
    # a missing movie must fail so the player's source recovery can run.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /brand/ {
        try_files $uri =404;
    }

    location ^~ /landing/ {
        try_files $uri =404;

        # The base Nginx MIME table does not include WebVTT captions.
        location ~ \.vtt$ {
            types { text/vtt vtt; }
            try_files $uri =404;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy health check to the backend server
    location /health {
        proxy_pass http://server:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://server:3000/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Workspace backups are accepted up to 25 MB by Express. Keep image uploads
    # at the smaller global limit while allowing the documented restore size.
    location = /api/v1/workspaces/restore {
        client_max_body_size 26m;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the backend server
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # This is the public ingress. Replace client-supplied forwarding headers
        # so the API's trusted proxy only supplies values observed by Nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.io connections
    location /socket.io/ {
        proxy_pass http://server:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
