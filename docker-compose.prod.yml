
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: krama-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krama_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krama_password}
      POSTGRES_DB: ${POSTGRES_DB:-krama_os}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krama_user} -d ${POSTGRES_DB:-krama_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krama-prod-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-krama_redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - prod_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-krama_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: krama-prod-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-krama_user}:${POSTGRES_PASSWORD:-krama_password}@db:5432/${POSTGRES_DB:-krama_os}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-krama_redis_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-krama_super_secret_jwt_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: krama-prod-worker
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-krama_user}:${POSTGRES_PASSWORD:-krama_password}@db:5432/${POSTGRES_DB:-krama_os}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-krama_redis_secret}@redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: krama-prod-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  prod_postgres_data:
  prod_redis_data:
