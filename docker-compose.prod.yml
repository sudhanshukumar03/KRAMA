
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: krama-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krama_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-krama_os}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krama_user} -d ${POSTGRES_DB:-krama_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krama-prod-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}", "--appendonly", "yes"]
    volumes:
      - prod_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: krama-server:prod
    container_name: krama-prod-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-krama_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@db:5432/${POSTGRES_DB:-krama_os}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379
      # Only internal containers can reach the API; Nginx is its public ingress.
      - TRUST_PROXY_CIDRS=${KRAMA_PROXY_IP:-172.30.0.10}/32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - CALENDARIFIC_API_KEY=${CALENDARIFIC_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: krama-server:prod
    container_name: krama-prod-worker
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-krama_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@db:5432/${POSTGRES_DB:-krama_os}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: krama-prod-web
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      default:
        ipv4_address: ${KRAMA_PROXY_IP:-172.30.0.10}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  prod_postgres_data:
  prod_redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${KRAMA_DOCKER_SUBNET:-172.30.0.0/24}
