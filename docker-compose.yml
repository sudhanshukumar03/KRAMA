version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: krama-postgres
    environment:
      POSTGRES_USER: krama_user
      POSTGRES_PASSWORD: krama_password
      POSTGRES_DB: krama_os
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krama_user -d krama_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krama-redis
    command: redis-server --requirepass krama_redis_secret --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "krama_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: krama-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://krama_user:krama_password@db:5432/krama_os
      - REDIS_URL=redis://:krama_redis_secret@redis:6379
      - JWT_SECRET=krama_super_secret_jwt_key
      - PORT=3000
      - FRONTEND_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: krama-web
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
