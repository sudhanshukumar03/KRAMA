version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: krama-postgres
    environment:
      POSTGRES_USER: krama_user
      POSTGRES_PASSWORD: krama_password
      POSTGRES_DB: krama_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krama_user -d krama_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krama-redis
    command: redis-server --requirepass krama_redis_secret --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "krama_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
