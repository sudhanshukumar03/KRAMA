<svg width="1040" height="760" viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Krama OS system architecture</title>
<desc>A wiring-style diagram showing the webhook ingest, knowledge/execution/goals module spine, AI gateway and governance chain, infrastructure, and external services, connected by labeled data flows.</desc>

<rect x="0" y="0" width="1040" height="760" fill="#0d1117"/>

